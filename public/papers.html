<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>袋鼠数学 · 历年真题 PDF</title>
    <script src="auth-guard.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cream: #faf8f5;
            --warm: #f3ede6;
            --rose: #c4a08a;
            --rose-light: #e8d5c8;
            --rose-bg: #fdf5f0;
            --text: #3d3530;
            --text-light: #8a7e76;
            --accent: #b07d62;
        }

        body {
            font-family: 'Noto Serif SC', 'Georgia', serif;
            background: var(--cream);
            min-height: 100vh;
            color: var(--text);
        }

        .page { max-width: 860px; margin: 0 auto; padding: 48px 24px; }

        .page-header { text-align: center; margin-bottom: 36px; }

        .page-header h1 {
            font-family: 'Playfair Display', 'Noto Serif SC', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .page-header .sub { color: var(--text-light); font-size: 0.9rem; }

        .nav-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 32px;
        }

        .nav-link {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 18px;
            border: 1px solid var(--warm);
            border-radius: 16px;
            transition: all 0.2s;
        }

        .nav-link:hover { color: var(--accent); border-color: var(--rose); }

        /* Level tabs */
        .level-switch {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--rose-light);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .lv-tab {
            padding: 10px 18px;
            font-size: 0.9rem;
            color: var(--text-light);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .lv-tab:hover { color: var(--text); }
        .lv-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

        /* Paper cards */
        .papers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 14px;
        }

        .paper-card {
            background: white;
            border: 1px solid var(--warm);
            border-radius: 12px;
            padding: 24px 12px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: all 0.2s;
        }

        .paper-card:hover {
            border-color: var(--rose);
            box-shadow: 0 4px 16px rgba(180,140,110,0.1);
            transform: translateY(-2px);
        }

        .paper-card .year {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .paper-card .label { color: var(--text-light); font-size: 0.8rem; }

        /* PDF viewer */
        .pdf-viewer {
            background: white;
            border: 1px solid var(--warm);
            border-radius: 12px;
            overflow: hidden;
        }

        .pdf-header {
            padding: 14px 20px;
            background: var(--cream);
            border-bottom: 1px solid var(--warm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pdf-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .download-btn {
            background: var(--accent);
            color: white;
            padding: 7px 18px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 0.8rem;
            transition: background 0.2s;
        }

        .download-btn:hover { background: #9a6b52; }

        .back-list-btn {
            display: inline-block;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 16px;
            border: 1px solid var(--rose-light);
            border-radius: 14px;
            background: white;
            cursor: pointer;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .back-list-btn:hover { border-color: var(--accent); }

        iframe { width: 100%; height: 80vh; border: none; }

        @media (max-width: 600px) {
            .page-header h1 { font-size: 1.6rem; }
            .papers-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
            .page { padding: 32px 16px; }
            .lv-tab { padding: 8px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="page-header">
            <h1>历年真题</h1>
            <p class="sub" id="subtitle">袋鼠数学 · 2013 — 2025</p>
        </div>

        <div class="nav-row">
            <a href="index.html" class="nav-link">← 首页</a>
            <a href="quiz.html" class="nav-link" id="quizLink">在线练习</a>
        </div>

        <div class="level-switch">
            <div class="lv-tab" data-level="a" onclick="switchLevel('a')">Level A · 1-2年级</div>
            <div class="lv-tab" data-level="b" onclick="switchLevel('b')">Level B · 3-4年级</div>
            <div class="lv-tab" data-level="c" onclick="switchLevel('c')">Level C · 5-6年级</div>
            <div class="lv-tab" data-level="d" onclick="switchLevel('d')">Level D · 7-8年级</div>
            <div class="lv-tab" data-level="e" onclick="switchLevel('e')">Level E · 9-10年级</div>
            <div class="lv-tab" data-level="f" onclick="switchLevel('f')">Level F · 11-12年级</div>
        </div>

        <div id="content" class="papers-grid"></div>
    </div>

    <script>
        let currentLevel = new URLSearchParams(location.search).get('level') || 'b';

        const levelMeta = {
            a: { label: 'Level A', grade: '1-2年级' },
            b: { label: 'Level B', grade: '3-4年级' },
            c: { label: 'Level C', grade: '5-6年级' },
            d: { label: 'Level D', grade: '7-8年级' },
            e: { label: 'Level E', grade: '9-10年级' },
            f: { label: 'Level F', grade: '11-12年级' }
        };

        const papersB = [
            { year: 2025, file: '2025 等级B：3-4年级.pdf' },
            { year: 2024, file: '2024 等级B：3-4年级.pdf' },
            { year: 2023, file: '2023 等级B：3-4年级.pdf' },
            { year: 2022, file: '2022 等级2：3-4年级.pdf' },
            { year: 2021, file: '2021 等级2：3-4年级.pdf' },
            { year: 2020, file: '2020 等级2：3-4年级.pdf' },
            { year: 2019, file: '2019 等级2：3-4年级.pdf' },
            { year: 2018, file: '2018 等级2：3-4年级.pdf' },
            { year: 2017, file: '2017 等级2：3-4年级.pdf' },
            { year: 2016, file: '2016 等级2：3-4年级.pdf' },
            { year: 2015, file: '2015 等级2：3-4年级.pdf' },
            { year: 2014, file: '2014 等级2：3-4年级.pdf' },
            { year: 2013, file: '2013 等级2：3-4年级.pdf' }
        ];

        const papersC = [
            { year: 2025, file: '2025 等级C：5-6年级.pdf' },
            { year: 2024, file: '2024 等级C：5-6年级.pdf' },
            { year: 2023, file: '2023 等级C：5-6年级.pdf' },
            { year: 2022, file: '2022 等级3：5-6年级.pdf' },
            { year: 2021, file: '2021 等级3：5-6年级.pdf' },
            { year: 2020, file: '2020 等级3：5-6年级.pdf' },
            { year: 2019, file: '2019 等级3：5-6年级.pdf' },
            { year: 2018, file: '2018 等级3：5-6年级.pdf' },
            { year: 2017, file: '2017 等级3：5-6年级.pdf' },
            { year: 2016, file: '2016 等级3：5-6年级.pdf' },
            { year: 2015, file: '2015 等级3：5-6年级.pdf' },
            { year: 2014, file: '2014 等级3：5-6年级.pdf' },
            { year: 2013, file: '2013 等级3：5-6年级.pdf' }
        ];

        // For new levels, papers will be loaded dynamically from their directories
        // For now we store known paper lists for B and C; others use directory-based loading
        const staticPapers = { b: papersB, c: papersC };

        function papersDir() {
            return currentLevel === 'b' ? 'papers' : `level-${currentLevel}/papers`;
        }

        function getConfig() {
            const meta = levelMeta[currentLevel] || levelMeta.b;
            return {
                papers: staticPapers[currentLevel] || [],
                dir: papersDir(),
                label: meta.label,
                grade: meta.grade,
            };
        }

        function switchLevel(level) {
            currentLevel = level;
            history.replaceState(null, '', level === 'b' ? 'papers.html' : `papers.html?level=${level}`);
            document.querySelectorAll('.lv-tab').forEach(t =>
                t.classList.toggle('active', t.dataset.level === level));
            updateHeader();
            renderList();
        }

        function updateHeader() {
            const cfg = getConfig();
            document.getElementById('subtitle').textContent =
                `袋鼠数学 ${cfg.label} · ${cfg.grade}`;
            document.getElementById('quizLink').href =
                currentLevel === 'b' ? 'quiz.html' : `quiz.html?level=${currentLevel}`;
        }

        function showPaper(file, year) {
            const cfg = getConfig();
            document.getElementById('content').className = '';
            document.getElementById('content').innerHTML = `
                <a href="javascript:renderList()" class="back-list-btn">← 返回列表</a>
                <div class="pdf-viewer">
                    <div class="pdf-header">
                        <span class="pdf-title">${year} 年真题</span>
                        <a href="${cfg.dir}/${file}" download class="download-btn">下载 PDF</a>
                    </div>
                    <iframe src="${cfg.dir}/${file}"></iframe>
                </div>`;
            window.scrollTo(0, 0);
        }

        async function renderList() {
            const cfg = getConfig();
            let papers = cfg.papers;

            // For levels without static paper lists, try loading index from papers dir
            if (!papers.length) {
                try {
                    const r = await fetch(`${cfg.dir}/index.json`);
                    if (r.ok) {
                        const d = await r.json();
                        papers = d.papers || [];
                    }
                } catch {}
            }

            if (!papers.length) {
                document.getElementById('content').className = 'papers-grid';
                document.getElementById('content').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-light);padding:40px;">暂无 PDF 数据</div>';
                return;
            }

            document.getElementById('content').className = 'papers-grid';
            document.getElementById('content').innerHTML = papers.map(p => `
                <a href="javascript:showPaper('${encodeURIComponent(p.file)}', ${p.year})" class="paper-card">
                    <div class="year">${p.year}</div>
                    <div class="label">查看 / 下载</div>
                </a>
            `).join('');
        }

        // Init
        document.querySelectorAll('.lv-tab').forEach(t =>
            t.classList.toggle('active', t.dataset.level === currentLevel));
        updateHeader();
        renderList();
    </script>
</body>
</html>
