<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>袋鼠数学历年真题 PDF · Level A–F</title>
    <meta name="description" content="下载袋鼠数学竞赛历年真题 PDF（Level A–F，2013–2025），含题目与解析原卷。">
    <meta property="og:title" content="袋鼠数学历年真题 PDF">
    <meta property="og:description" content="Level A–F 历年真题 PDF 原卷查看与下载">
    <meta property="og:type" content="website">
    <script src="auth-guard.js"></script>
    <script src="analytics.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cream: #faf8f5;
            --warm: #f3ede6;
            --rose: #c4a08a;
            --rose-light: #e8d5c8;
            --rose-bg: #fdf5f0;
            --text: #3d3530;
            --text-light: #8a7e76;
            --accent: #b07d62;
            --font-serif: "Songti SC", "STSong", "Noto Serif SC", "Georgia", serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background: var(--cream);
            min-height: 100vh;
            color: var(--text);
        }

        .page { max-width: 860px; margin: 0 auto; padding: 48px 24px; }

        .page-header { text-align: center; margin-bottom: 36px; }

        .page-header h1 {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .page-header .sub { color: var(--text-light); font-size: 0.9rem; }

        .nav-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 32px;
        }

        .nav-link {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 18px;
            border: 1px solid var(--warm);
            border-radius: 16px;
            transition: all 0.2s;
        }

        .nav-link:hover { color: var(--accent); border-color: var(--rose); }

        /* Level tabs */
        .level-switch {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--rose-light);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .lv-tab {
            padding: 10px 18px;
            font-size: 0.9rem;
            color: var(--text-light);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .lv-tab:hover { color: var(--text); }
        .lv-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

        /* Paper cards */
        .papers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 14px;
        }

        .paper-card {
            background: white;
            border: 1px solid var(--warm);
            border-radius: 12px;
            padding: 24px 12px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: all 0.2s;
        }

        .paper-card:hover {
            border-color: var(--rose);
            box-shadow: 0 4px 16px rgba(180,140,110,0.1);
            transform: translateY(-2px);
        }

        .paper-card .year {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .paper-card .label { color: var(--text-light); font-size: 0.8rem; }

        /* PDF viewer */
        .pdf-viewer {
            background: white;
            border: 1px solid var(--warm);
            border-radius: 12px;
            overflow: hidden;
        }

        .pdf-header {
            padding: 14px 20px;
            background: var(--cream);
            border-bottom: 1px solid var(--warm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pdf-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .download-btn {
            background: var(--accent);
            color: white;
            padding: 7px 18px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 0.8rem;
            transition: background 0.2s;
        }

        .download-btn:hover { background: #9a6b52; }

        .back-list-btn {
            display: inline-block;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 16px;
            border: 1px solid var(--rose-light);
            border-radius: 14px;
            background: white;
            cursor: pointer;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .back-list-btn:hover { border-color: var(--accent); }

        iframe { width: 100%; height: 80vh; border: none; }

        @media (max-width: 600px) {
            .page-header h1 { font-size: 1.6rem; }
            .papers-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
            .page { padding: 32px 16px; }
            .lv-tab { padding: 8px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="page-header" style="position:relative;">
            <button class="i18n-toggle" onclick="I18n.toggle()" style="position:absolute;top:0;right:0;padding:4px 14px;border-radius:999px;border:1px solid var(--rose-light);background:white;color:var(--text);font-size:0.82rem;font-family:inherit;cursor:pointer;">EN</button>
            <h1 data-i18n="papers_title">历年真题</h1>
            <p class="sub" id="subtitle">袋鼠数学 · 2013 — 2025</p>
        </div>

        <div class="nav-row">
            <a href="index.html" class="nav-link" data-i18n="nav_home">← 首页</a>
            <a href="quiz.html" class="nav-link" id="quizLink" data-i18n="nav_quiz">在线练习</a>
        </div>

        <div class="level-switch" id="levelSwitch">
            <div class="lv-tab" data-level="a" onclick="switchLevel('a')">Level A · 1-2年级</div>
            <div class="lv-tab" data-level="b" onclick="switchLevel('b')">Level B · 3-4年级</div>
            <div class="lv-tab" data-level="c" onclick="switchLevel('c')">Level C · 5-6年级</div>
            <div class="lv-tab" data-level="d" onclick="switchLevel('d')">Level D · 7-8年级</div>
            <div class="lv-tab" data-level="e" onclick="switchLevel('e')">Level E · 9-10年级</div>
            <div class="lv-tab" data-level="f" onclick="switchLevel('f')">Level F · 11-12年级</div>
        </div>

        <div id="content" class="papers-grid"></div>
    </div>

    <script>
    window.I18N = {
        zh: {
            papers_title: '历年真题', nav_home: '← 首页', nav_quiz: '在线练习',
            subtitle_tpl: '袋鼠数学 {label} · {grade}',
            back_list: '← 返回列表', download_pdf: '下载 PDF', year_paper: '{year} 年真题',
            view_download: '查看 / 下载', no_data: '暂无 PDF 数据',
            login_download: '登录后可下载 PDF 真题文件。',
            grade_a: '1-2年级', grade_b: '3-4年级', grade_c: '5-6年级',
            grade_d: '7-8年级', grade_e: '9-10年级', grade_f: '11-12年级',
        },
        en: {
            papers_title: 'Past Papers', nav_home: '← Home', nav_quiz: 'Online Practice',
            subtitle_tpl: 'Math Kangaroo {label} · {grade}',
            back_list: '← Back to List', download_pdf: 'Download PDF', year_paper: '{year} Paper',
            view_download: 'View / Download', no_data: 'No papers available',
            login_download: 'Please login to download PDF papers.',
            grade_a: 'Grades 1-2', grade_b: 'Grades 3-4', grade_c: 'Grades 5-6',
            grade_d: 'Grades 7-8', grade_e: 'Grades 9-10', grade_f: 'Grades 11-12',
        }
    };
    </script>
    <script src="i18n.js"></script>

    <script>
        let currentLevel = new URLSearchParams(location.search).get('level') || 'b';

        const levelMeta = {

            b: { label: 'Level B' },
            c: { label: 'Level C' },
            d: { label: 'Level D' },
            e: { label: 'Level E' },
            f: { label: 'Level F' }
        };

        const papersB = [
            { year: 2025, file: '2025 等级B：3-4年级.pdf' },

            { year: 2023, file: '2023 等级B：3-4年级.pdf' },
            { year: 2022, file: '2022 等级2：3-4年级.pdf' },
            { year: 2021, file: '2021 等级2：3-4年级.pdf' },
            { year: 2020, file: '2020 等级2：3-4年级.pdf' },
            { year: 2019, file: '2019 等级2：3-4年级.pdf' },
            { year: 2018, file: '2018 等级2：3-4年级.pdf' },
            { year: 2017, file: '2017 等级2：3-4年级.pdf' },
            { year: 2016, file: '2016 等级2：3-4年级.pdf' },
            { year: 2015, file: '2015 等级2：3-4年级.pdf' },
            { year: 2014, file: '2014 等级2：3-4年级.pdf' },
            { year: 2013, file: '2013 等级2：3-4年级.pdf' }
        ];

        const papersC = [
            { year: 2025, file: '2025 等级C：5-6年级.pdf' },
            { year: 2024, file: '2024 等级C：5-6年级.pdf' },
            { year: 2023, file: '2023 等级C：5-6年级.pdf' },
            { year: 2022, file: '2022 等级3：5-6年级.pdf' },
            { year: 2021, file: '2021 等级3：5-6年级.pdf' },
            { year: 2020, file: '2020 等级3：5-6年级.pdf' },
            { year: 2019, file: '2019 等级3：5-6年级.pdf' },
            { year: 2018, file: '2018 等级3：5-6年级.pdf' },
            { year: 2017, file: '2017 等级3：5-6年级.pdf' },
            { year: 2016, file: '2016 等级3：5-6年级.pdf' },
            { year: 2015, file: '2015 等级3：5-6年级.pdf' },
            { year: 2014, file: '2014 等级3：5-6年级.pdf' },

        ];

        const papersA = [
            { year: 2025, file: '2025 等级A：1-2年级.pdf' },
            { year: 2024, file: '2024 等级A：1-2年级.pdf' },
            { year: 2023, file: '2023 等级A：1-2年级.pdf' },
            { year: 2022, file: '2022 等级1：1-2年级.pdf' },
            { year: 2021, file: '2021 等级1：1-2年级.pdf' },
            { year: 2020, file: '2020 等级1：1-2年级.pdf' },
            { year: 2019, file: '2019 等级1：1-2年级.pdf' },
            { year: 2018, file: '2018 等级1：1-2年级.pdf' },
            { year: 2017, file: '2017 等级1：1-2年级.pdf' },
            { year: 2016, file: '2016 等级1：1-2年级.pdf' },
            { year: 2015, file: '2015 等级1：1-2年级.pdf' },
            { year: 2014, file: '2014 等级1：1-2年级.pdf' },
            { year: 2013, file: '2013 等级1：1-2年级.pdf' }
        ];

        const papersD = [
            { year: 2025, file: '2025 等级D：7-8年级.pdf' },
            { year: 2024, file: '2024 等级D：7-8年级.pdf' },
            { year: 2023, file: '2023 等级D：7-8年级.pdf' },
            { year: 2022, file: '2022 等级4：7-8年级.pdf' },
            { year: 2021, file: '2021 等级4：7-8年级.pdf' },
            { year: 2020, file: '2020 等级4：7-8年级.pdf' },
            { year: 2019, file: '2019 等级4：7-8年级.pdf' },
            { year: 2018, file: '2018 等级4：7-8年级.pdf' },
            { year: 2017, file: '2017 等级4：7-8年级.pdf' },
            { year: 2016, file: '2016 等级4：7-8年级.pdf' },
            { year: 2015, file: '2015 等级4：7-8年级.pdf' },
            { year: 2014, file: '2014 等级4：7-8年级.pdf' },
            { year: 2013, file: '2013 等级4：7-8年级.pdf' }
        ];

        const papersE = [
            { year: 2025, file: '2025 等级E：9-10年级.pdf' },
            { year: 2024, file: '2024 等级E：9-10年级.pdf' },
            { year: 2023, file: '2023 等级E：9-10年级.pdf' },
            { year: 2022, file: '2022 等级5：9-10年级.pdf' },
            { year: 2021, file: '2021 等级5：9-10年级.pdf' },
            { year: 2020, file: '2020 等级5：9-10年级.pdf' },
            { year: 2019, file: '2019 等级5：9-10年级.pdf' },
            { year: 2018, file: '2018 等级5：9-10年级.pdf' },
            { year: 2017, file: '2017 等级5：9-10年级.pdf' },
            { year: 2016, file: '2016 等级5：9-10年级.pdf' },
            { year: 2015, file: '2015 等级5：9-10年级.pdf' },
            { year: 2014, file: '2014 等级5：9-10年级.pdf' },
            { year: 2013, file: '2013 等级5：9-10年级.pdf' }
        ];

        const papersF = [
            { year: 2025, file: '2025 等级F：11-12年级.pdf' },
            { year: 2024, file: '2024 等级F：11-12年级.pdf' },
            { year: 2023, file: '2023 等级F：11-12年级.pdf' },
            { year: 2022, file: '2022 等级6：11-12年级.pdf' },
            { year: 2021, file: '2021 等级6：11-12年级.pdf' },
            { year: 2020, file: '2020 等级6：11-12年级.pdf' },
            { year: 2019, file: '2019 等级6：11-12年级.pdf' },
            { year: 2018, file: '2018 等级6：11-12年级.pdf' },
            { year: 2017, file: '2017 等级6：11-12年级.pdf' },
            { year: 2016, file: '2016 等级6：11-12年级.pdf' },
            { year: 2015, file: '2015 等级6：11-12年级.pdf' },
            { year: 2014, file: '2014 等级6：11-12年级.pdf' },
            { year: 2013, file: '2013 等级6：11-12年级.pdf' }
        ];

        const staticPapers = { a: papersA, b: papersB, c: papersC, d: papersD, e: papersE, f: papersF };

        function papersDir() {
            return currentLevel === 'b' ? 'papers' : `level-${currentLevel}/papers`;
        }

        function getConfig() {
            const meta = levelMeta[currentLevel] || levelMeta.b;
            return {
                papers: staticPapers[currentLevel] || [],
                dir: papersDir(),
                label: meta.label,
                grade: meta.grade,
            };
        }

        function switchLevel(level) {
            currentLevel = level;
            history.replaceState(null, '', level === 'b' ? 'papers.html' : `papers.html?level=${level}`);
            document.querySelectorAll('.lv-tab').forEach(t =>
                t.classList.toggle('active', t.dataset.level === level));
            updateHeader();
            renderList();
        }

        function updateHeader() {
            const cfg = getConfig();
            const grade = I18n.t('grade_' + currentLevel);
            document.getElementById('subtitle').textContent =
                I18n.t('subtitle_tpl').replace('{label}', cfg.label).replace('{grade}', grade);
            document.getElementById('quizLink').href =
                currentLevel === 'b' ? 'quiz.html' : `quiz.html?level=${currentLevel}`;
            // Update level tabs text
            document.querySelectorAll('.lv-tab').forEach(t => {
                const lv = t.dataset.level;
                t.textContent = `${levelMeta[lv].label} · ${I18n.t('grade_' + lv)}`;
            });
        }

        function showPaper(file, year) {
            const cfg = getConfig();
            const downloadUrl = `${cfg.dir}/${file}`;
            document.getElementById('content').className = '';
            document.getElementById('content').innerHTML = `
                <a href="javascript:renderList()" class="back-list-btn">${I18n.t('back_list')}</a>
                <div class="pdf-viewer">
                    <div class="pdf-header">
                        <span class="pdf-title">${I18n.t('year_paper').replace('{year}', year)}</span>
                        <a href="javascript:void(0)" onclick="downloadPDF('${downloadUrl}')" class="download-btn">${I18n.t('download_pdf')}</a>
                    </div>
                    <iframe src="${cfg.dir}/${file}"></iframe>
                </div>`;
            window.scrollTo(0, 0);
        }

        function downloadPDF(url) {
            if (!requireLogin(I18n.t('login_download'))) return;
            const a = document.createElement('a');
            a.href = url; a.download = ''; document.body.appendChild(a);
            a.click(); document.body.removeChild(a);
        }

        async function renderList() {
            const cfg = getConfig();
            let papers = cfg.papers;

            // For levels without static paper lists, try loading index from papers dir
            if (!papers.length) {
                try {
                    const r = await fetch(`${cfg.dir}/index.json`);
                    if (r.ok) {
                        const d = await r.json();
                        papers = d.papers || [];
                    }
                } catch {}
            }

            if (!papers.length) {
                document.getElementById('content').className = 'papers-grid';
                document.getElementById('content').innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--text-light);padding:40px;">${I18n.t('no_data')}</div>`;
                return;
            }

            document.getElementById('content').className = 'papers-grid';
            document.getElementById('content').innerHTML = papers.map(p => `
                <a href="javascript:showPaper('${encodeURIComponent(p.file)}', ${p.year})" class="paper-card">
                    <div class="year">${p.year}</div>
                    <div class="label">${I18n.t('view_download')}</div>
                </a>
            `).join('');
        }

        // Re-render on language switch
        I18n.onSwitch(() => { updateHeader(); renderList(); });

        // Init
        document.querySelectorAll('.lv-tab').forEach(t =>
            t.classList.toggle('active', t.dataset.level === currentLevel));
        updateHeader();
        renderList();
    </script>
</body>
</html>
