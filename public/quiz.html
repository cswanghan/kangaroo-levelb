<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>袋鼠数学 · 在线练习</title>
    <script src="auth-guard.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Raleway:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        :root {
            --paper: #FDFBF9; --paper-shadow: #E8E4DF; --desk: #EAE6E1;
            --ink: #171717; --ink-med: #5a5652; --ink-light: #A39E99; --ink-faint: rgba(23,23,23,0.08);
            --rose: #BA6D73; --blush: #F1BABA; --blush-faint: rgba(241,186,186,0.3);
            --ring: linear-gradient(90deg, #d5d1cc 0%, #fcfbfa 30%, #b8b3ae 80%, #9e9a95 100%);
            --font-serif: 'Lora', 'Noto Serif SC', serif;
            --font-sans: 'Raleway', 'Noto Serif SC', sans-serif;
            --success: #6b9a7d; --success-bg: #edf5f0; --error: #c47070; --error-bg: #fdf0f0;
        }

        body {
            font-family: var(--font-sans); color: var(--ink);
            background: var(--desk); background-image: radial-gradient(circle at 50% 0%, #F5F2EF, var(--desk));
            min-height: 100vh;
        }

        /* ===== Year Select (same style) ===== */
        .select-page { max-width: 800px; margin: 0 auto; padding: 48px 24px; }
        .select-header { text-align: center; margin-bottom: 36px; }
        .select-header h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 500; margin-bottom: 6px; }
        .select-header .sub { color: var(--ink-light); font-size: 0.9rem; }
        .nav-row { display: flex; justify-content: center; gap: 14px; margin-bottom: 32px; flex-wrap: wrap; }
        .nav-link {
            color: var(--ink-light); text-decoration: none; font-size: 0.85rem;
            padding: 6px 18px; border: 1px solid var(--paper-shadow); border-radius: 16px;
        }
        .nav-link:hover { color: var(--rose); border-color: var(--blush); }
        .nav-link.active { color: var(--rose); border-color: var(--blush); background: var(--blush-faint); }
        .level-switch { display: flex; justify-content: center; border-bottom: 1px solid var(--paper-shadow); margin-bottom: 32px; }
        .lv-tab { padding: 10px 28px; font-size: 0.9rem; color: var(--ink-light); cursor: pointer; border-bottom: 2px solid transparent; }
        .lv-tab:hover { color: var(--ink-med); }
        .lv-tab.active { color: var(--rose); border-bottom-color: var(--rose); font-weight: 600; }
        .year-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; }
        .year-card {
            background: var(--paper); border: 1px solid var(--paper-shadow); padding: 24px 12px;
            border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.2s;
        }
        .year-card:hover { border-color: var(--blush); box-shadow: 0 4px 16px rgba(0,0,0,0.05); transform: translateY(-2px); }
        .year-card .yr { font-family: var(--font-serif); font-size: 1.5rem; font-weight: 500; color: var(--rose); }
        .year-card .cnt { color: var(--ink-light); font-size: 0.8rem; margin-top: 4px; }

        /* ===== Book Quiz Layout ===== */
        .quiz-wrapper {
            display: none; min-height: 100vh;
            justify-content: center; align-items: center; padding: 24px; flex-direction: column; gap: 16px;
        }

        /* Top info bar above book */
        .book-topbar {
            width: 100%; max-width: 1040px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; font-size: 0.8rem; color: var(--ink-light);
        }
        .book-topbar .back-btn {
            background: none; border: none; font-family: inherit; font-size: 0.85rem;
            color: var(--rose); cursor: pointer; padding: 4px 0;
        }
        .book-topbar .stats { display: flex; gap: 18px; }
        .book-topbar .val { font-weight: 600; color: var(--rose); }

        /* Progress under topbar */
        .book-progress { width: 100%; max-width: 1040px; height: 2px; background: var(--paper-shadow); border-radius: 1px; }
        .book-progress-fill { height: 100%; background: var(--rose); transition: width 0.3s; border-radius: 1px; }

        /* The book */
        .book {
            position: relative; display: flex; width: 1040px; height: 680px;
            background: var(--paper); border-radius: 4px 12px 12px 4px;
            box-shadow: -1px 0 2px rgba(0,0,0,0.02), 1px 0 2px rgba(0,0,0,0.02),
                0 20px 40px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.04),
                20px 20px 60px rgba(0,0,0,0.05), inset -2px 0 4px rgba(0,0,0,0.02);
        }

        .book::after {
            content: ''; position: absolute; top: 4px; right: -6px; bottom: -4px; width: 100%;
            background: linear-gradient(to right, transparent 98%, #EAE5DF 98%, #F2EFEA 99%, #DCD7D0 100%);
            border-radius: 4px 12px 12px 4px; z-index: -1; box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }

        /* Pages */
        .pg { flex: 1; position: relative; overflow: hidden; background: var(--paper); }
        .pg.left {
            border-radius: 4px 0 0 4px; padding: 36px 40px 36px 48px;
            background: linear-gradient(to right, var(--paper) 85%, #F4F1ED 95%, #EBE7E1 100%);
            overflow-y: auto;
        }
        .pg.right {
            border-radius: 0 12px 12px 0; padding: 36px 48px 36px 40px;
            background: linear-gradient(to left, var(--paper) 85%, #F4F1ED 95%, #EBE7E1 100%);
            display: flex; flex-direction: column;
        }

        /* Spine rings */
        .spine {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 30px; height: 100%; z-index: 5;
            display: flex; flex-direction: column; justify-content: space-evenly;
            padding: 40px 0; pointer-events: none;
        }
        .ring-group { position: relative; width: 100%; height: 24px; }
        .ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: 48px; height: 8px; background: var(--ring); border-radius: 4px;
            box-shadow: 0 3px 4px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.8); z-index: 2;
        }
        .hole {
            position: absolute; top: 50%; transform: translateY(-50%); width: 14px; height: 14px;
            background: var(--desk); border-radius: 50%;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.2), inset -1px -1px 2px rgba(255,255,255,0.5); z-index: 1;
        }
        .hole.l { left: -18px; }
        .hole.r { right: -18px; }

        /* Page curl */
        .page-curl-zone { position: absolute; bottom: 0; right: 0; width: 80px; height: 80px; cursor: pointer; z-index: 10; }
        .page-curl {
            position: absolute; bottom: 0; right: 0; width: 0; height: 0;
            background: linear-gradient(135deg, transparent 45%, #fff 50%, #e0dcd7 55%, transparent 60%);
            box-shadow: -4px -4px 10px rgba(0,0,0,0.05); transition: all 0.4s cubic-bezier(0.25,1,0.5,1);
            pointer-events: none; border-top-left-radius: 10px;
        }
        .page-curl-zone:hover + .page-curl { width: 50px; height: 50px; }

        /* Corner decoration */
        .corner-deco { position: absolute; top: 20px; right: 20px; display: flex; gap: 4px; }
        .corner-dot { width: 4px; height: 4px; background: var(--blush); border-radius: 50%; }

        /* Left page content */
        .q-meta {
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px;
            color: var(--rose); margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
        }
        .q-meta-line { height: 1px; flex: 1; background: var(--blush-faint); }

        .q-number {
            font-family: var(--font-serif); font-size: 2.2rem; font-weight: 400;
            color: var(--ink); line-height: 1.1; margin-bottom: 4px;
        }
        .q-sub { font-family: var(--font-serif); font-size: 1rem; color: var(--ink-med); font-style: italic; margin-bottom: 20px; }

        /* Issue #5: larger default image */
        .question-image {
            width: 100%; max-width: 100%; border-radius: 6px; border: 1px solid var(--paper-shadow);
            background: white; cursor: zoom-in;
            min-height: 200px; object-fit: contain;
        }
        .question-image.loading {
            background: linear-gradient(90deg, #f0ece8 25%, #e8e4df 50%, #f0ece8 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }

        /* Lightbox overlay */
        .lightbox {
            display: none; position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
            justify-content: center; align-items: center; padding: 20px;
            cursor: zoom-out;
        }
        .lightbox.open { display: flex; }
        .lightbox img {
            max-width: 95vw; max-height: 92vh; object-fit: contain;
            border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            transform: scale(0.95); transition: transform 0.25s ease;
        }
        .lightbox.open img { transform: scale(1); }
        .lightbox-hint {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.6); font-size: 0.8rem; pointer-events: none;
        }

        /* Right page content */
        .section-title {
            font-family: var(--font-serif); font-size: 1.3rem; color: var(--ink);
            margin-bottom: 20px; position: relative; display: inline-block;
        }
        .section-title::after {
            content: ''; position: absolute; bottom: 4px; left: 0; width: 100%;
            height: 8px; background: var(--blush-faint); z-index: -1;
        }

        .options { display: grid; gap: 10px; flex: 0; }
        .option {
            display: flex; align-items: center; gap: 14px; padding: 12px 14px;
            border-bottom: 1px solid var(--ink-faint); cursor: pointer; transition: all 0.15s; user-select: none;
        }
        .option:last-child { border-bottom: none; }
        .option:hover:not(.disabled) { background: var(--blush-faint); }
        .option.selected { background: var(--blush-faint); }
        .option.correct { background: var(--success-bg); }
        .option.wrong { background: var(--error-bg); }
        .option.disabled { cursor: default; opacity: 0.6; }

        .opt-check {
            width: 20px; height: 20px; border: 1.5px solid var(--ink-light); border-radius: 50%;
            flex-shrink: 0; transition: all 0.2s; position: relative;
        }
        .opt-check:hover { border-color: var(--rose); }
        .option.selected .opt-check { background: var(--rose); border-color: var(--rose); }
        .option.selected .opt-check::after {
            content: ''; position: absolute; top: 4px; left: 6px; width: 4px; height: 8px;
            border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
        }
        .option.correct .opt-check { background: var(--success); border-color: var(--success); }
        .option.correct .opt-check::after {
            content: ''; position: absolute; top: 4px; left: 6px; width: 4px; height: 8px;
            border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
        }
        .option.wrong .opt-check { background: var(--error); border-color: var(--error); }
        .option.wrong .opt-check::after {
            content: '\2715'; color: white; font-size: 10px; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%,-50%);
        }

        .opt-label { font-size: 0.95rem; color: var(--ink); }
        .option.disabled.correct .opt-label { color: var(--success); }
        .option.disabled.wrong .opt-label { text-decoration: line-through; text-decoration-color: var(--blush); color: var(--ink-light); }

        .feedback {
            margin-top: 16px; padding: 10px 14px; border-radius: 6px; display: none;
            font-size: 0.85rem; font-family: var(--font-serif); font-style: italic;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: var(--success-bg); color: #3d6b4f; }
        .feedback.wrong { background: var(--error-bg); color: #8b4444; }

        .right-spacer { flex: 1; }

        /* Issue #6: Action buttons - single primary action */
        .action-bar {
            display: flex; gap: 10px; padding-top: 16px;
            border-top: 1px solid var(--ink-faint);
        }
        .btn {
            flex: 1; padding: 10px 14px; border: none; border-radius: 18px;
            font-size: 0.85rem; cursor: pointer; font-weight: 500; font-family: var(--font-sans); transition: all 0.15s;
        }
        .btn-primary { background: var(--rose); color: white; }
        .btn-primary:hover { background: #a55e64; }
        .btn-outline { background: transparent; border: 1px solid var(--blush); color: var(--rose); }
        .btn-outline:hover { background: var(--blush-faint); }
        .btn-ghost { background: transparent; border: 1px solid transparent; color: var(--ink-light); }
        .btn-ghost:hover { color: var(--ink-med); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ===== Results ===== */
        .results-page { display: none; max-width: 480px; margin: 80px auto; padding: 20px; }
        .results-card {
            background: var(--paper); border: 1px solid var(--paper-shadow); border-radius: 16px;
            padding: 48px 36px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
        .results-card h2 { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 400; margin-bottom: 8px; }
        .results-score { font-family: var(--font-serif); font-size: 3.2rem; font-weight: 500; color: var(--rose); margin: 16px 0; }
        .results-detail { color: var(--ink-light); margin-bottom: 16px; font-size: 0.9rem; line-height: 1.8; }
        .results-breakdown {
            text-align: left; background: var(--blush-faint); border-radius: 10px;
            padding: 14px 18px; margin-bottom: 20px; font-size: 0.82rem; color: var(--ink-med); line-height: 1.8;
        }
        .results-breakdown .label { display: inline-block; min-width: 100px; }
        .results-grade { padding: 10px 24px; border-radius: 10px; display: inline-block; margin-bottom: 28px; font-size: 1.1rem; }
        .grade-a { background: var(--success-bg); color: #3d6b4f; }
        .grade-b { background: #eef2fa; color: #4a5e8a; }
        .grade-c { background: var(--blush-faint); color: #8a6a3d; }
        .grade-d { background: var(--error-bg); color: #8b4444; }
        .results-actions { display: flex; gap: 12px; justify-content: center; }

        .loading { text-align: center; padding: 40px; color: var(--ink-light); }

        /* History */
        .history-item {
            background: var(--paper); border: 1px solid var(--paper-shadow); border-radius: 10px;
            padding: 14px 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .history-item .hi-left { }
        .history-item .hi-title { font-family: var(--font-serif); font-weight: 500; font-size: 0.95rem; }
        .history-item .hi-meta { font-size: 0.75rem; color: var(--ink-light); margin-top: 2px; }
        .history-item .hi-score { font-family: var(--font-serif); font-size: 1.3rem; font-weight: 500; color: var(--rose); }
        .history-empty { text-align: center; color: var(--ink-light); padding: 24px; font-size: 0.9rem; }

        /* Issue #3: Wrong questions book */
        .wrong-item {
            background: var(--paper); border: 1px solid var(--paper-shadow); border-radius: 10px;
            padding: 14px 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: all 0.2s;
        }
        .wrong-item:hover { border-color: var(--blush); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .wrong-item .wi-left { flex: 1; }
        .wrong-item .wi-title { font-family: var(--font-serif); font-weight: 500; font-size: 0.95rem; }
        .wrong-item .wi-meta { font-size: 0.75rem; color: var(--ink-light); margin-top: 2px; }
        .wrong-item .wi-answers { display: flex; gap: 12px; align-items: center; font-size: 0.85rem; }
        .wrong-item .wi-wrong { color: var(--error); text-decoration: line-through; }
        .wrong-item .wi-correct { color: var(--success); font-weight: 600; }
        .wrong-detail-overlay {
            display: none; position: fixed; inset: 0; z-index: 900;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(3px);
            justify-content: center; align-items: center; padding: 20px;
        }
        .wrong-detail-overlay.open { display: flex; }
        .wrong-detail-box {
            background: var(--paper); border-radius: 16px; padding: 28px; max-width: 600px; width: 95%;
            max-height: 85vh; overflow-y: auto;
            box-shadow: 0 16px 40px rgba(0,0,0,0.12);
        }
        .wrong-detail-box h3 { font-family: var(--font-serif); font-size: 1.2rem; margin-bottom: 16px; }
        .wrong-detail-box img { width: 100%; border-radius: 6px; border: 1px solid var(--paper-shadow); margin-bottom: 16px; cursor: zoom-in; }
        .wrong-detail-box .wd-info { font-size: 0.85rem; color: var(--ink-med); line-height: 1.8; margin-bottom: 16px; }
        .wrong-detail-box .wd-actions { display: flex; gap: 10px; justify-content: flex-end; }

        /* Confirm modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 900;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(3px);
            justify-content: center; align-items: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--paper); border: 1px solid var(--paper-shadow);
            border-radius: 16px; padding: 36px 32px; max-width: 380px; width: 90%;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0,0,0,0.12);
        }
        .modal-box .modal-icon { font-size: 2.4rem; margin-bottom: 12px; }
        .modal-box h3 {
            font-family: var(--font-serif); font-size: 1.3rem; font-weight: 500; margin-bottom: 8px;
        }
        .modal-box p { color: var(--ink-med); font-size: 0.85rem; line-height: 1.6; margin-bottom: 24px; }
        .modal-box .modal-info {
            background: var(--blush-faint); border-radius: 8px; padding: 10px 14px;
            font-size: 0.8rem; color: var(--ink-med); margin-bottom: 20px;
        }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions .btn { flex: 1; }

        /* Responsive */
        @media (max-width: 1100px) {
            .book { width: 96vw; height: auto; min-height: 500px; flex-direction: column; border-radius: 12px; }
            .pg.left { border-radius: 12px 12px 0 0; max-height: 50vh; overflow-y: auto; }
            .pg.right { border-radius: 0 0 12px 12px; }
            .spine { display: none; }
            .book::after { display: none; }
        }
        @media (max-width: 600px) {
            .select-header h1 { font-size: 1.6rem; }
            .year-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .quiz-wrapper { padding: 12px; }
        }
    </style>
</head>
<body>

<!-- ===== Year Select ===== -->
<div class="select-page" id="homePage">
    <div class="select-header">
        <h1>在线练习</h1>
        <p class="sub">选择年份开始做题</p>
    </div>
    <div class="nav-row">
        <a href="index.html" class="nav-link">← 首页</a>
        <a href="papers.html" class="nav-link" id="pdfLink">PDF 真题</a>
        <a href="javascript:showHistory()" class="nav-link" id="historyLink">历史成绩</a>
        <a href="javascript:showWrongBook()" class="nav-link" id="wrongLink">错题本</a>
    </div>
    <div class="level-switch">
        <div class="lv-tab" data-level="b" onclick="switchLevel('b')">Level B · 3-4年级</div>
        <div class="lv-tab" data-level="c" onclick="switchLevel('c')">Level C · 5-6年级</div>
    </div>
    <div class="year-grid" id="yearGrid"><div class="loading">加载中...</div></div>

    <!-- History panel (hidden by default) -->
    <div id="historyPanel" style="display:none; margin-top:24px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h2 style="font-family:var(--font-serif); font-size:1.3rem; font-weight:500;">历史成绩</h2>
            <a href="javascript:hidePanel()" class="nav-link" style="font-size:0.8rem;">关闭</a>
        </div>
        <div id="historyList"><div class="loading">加载中...</div></div>
    </div>

    <!-- Issue #3: Wrong questions book panel -->
    <div id="wrongPanel" style="display:none; margin-top:24px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h2 style="font-family:var(--font-serif); font-size:1.3rem; font-weight:500;">错题本</h2>
            <a href="javascript:hidePanel()" class="nav-link" style="font-size:0.8rem;">关闭</a>
        </div>
        <div id="wrongList"><div class="loading">加载中...</div></div>
    </div>
</div>

<!-- ===== Book Quiz ===== -->
<div class="quiz-wrapper" id="quizPage">
    <div class="book-topbar">
        <button class="back-btn" onclick="goHome()">← 返回</button>
        <span class="quiz-title" id="quizTitle" style="font-family:var(--font-serif);font-weight:500;"></span>
        <div class="stats">
            <span id="timerDisplay" class="val" style="font-family:var(--font-sans);letter-spacing:1px;">00:00</span>
            <span>已答 <span class="val" id="correctCount">0</span> / <span class="val" id="scorePercent">0</span></span>
        </div>
    </div>
    <div class="book-progress"><div class="book-progress-fill" id="progressFill"></div></div>

    <div class="book">
        <!-- Left page: question -->
        <div class="pg left" id="panelLeft">
            <div class="q-meta">
                <span id="questionBadge">第 1 题</span>
                <div class="q-meta-line"></div>
                <span id="questionPoints">3 分</span>
            </div>
            <div class="q-number" id="qNumber">Question 1</div>
            <div class="q-sub" id="qSub"></div>
            <img class="question-image" id="questionImage" alt="题目" onclick="openLightbox()">
        </div>

        <!-- Spine -->
        <div class="spine" id="spineRings"></div>

        <!-- Right page: answers -->
        <div class="pg right">
            <div class="corner-deco"><div class="corner-dot"></div><div class="corner-dot" style="opacity:0.5"></div></div>

            <h2 class="section-title">选择答案</h2>
            <div class="options" id="options"></div>
            <div class="feedback" id="feedback"></div>

            <div class="right-spacer"></div>

            <!-- Issue #6: Redesigned action bar -->
            <div class="action-bar" id="actionBar"></div>

            <div class="page-curl-zone" onclick="nextQuestion()"></div>
            <div class="page-curl"></div>
        </div>
    </div>
</div>

<!-- ===== Results ===== -->
<div class="results-page" id="resultsPage">
    <div class="results-card">
        <h2>完成</h2>
        <div class="results-score" id="finalScore">0</div>
        <div class="results-breakdown" id="finalBreakdown"></div>
        <div class="results-detail" id="finalDetail"></div>
        <div class="results-grade" id="finalGrade"></div>
        <div class="results-actions">
            <button class="btn btn-primary" onclick="restartQuiz()">重新做题</button>
            <button class="btn btn-outline" onclick="goHome()">返回</button>
        </div>
    </div>
</div>

<!-- Confirm start modal -->
<div class="modal-overlay" id="startModal">
    <div class="modal-box">
        <div class="modal-icon">📝</div>
        <h3 id="modalTitle">开始做题</h3>
        <p>点击开始后将自动计时，请确保准备好后再开始。</p>
        <div class="modal-info" id="modalInfo">—</div>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeStartModal()">取消</button>
            <button class="btn btn-primary" onclick="confirmStart()">开始</button>
        </div>
    </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" alt="题目大图">
    <div class="lightbox-hint">点击任意位置关闭</div>
</div>

<!-- Issue #3: Wrong question detail overlay -->
<div class="wrong-detail-overlay" id="wrongDetailOverlay" onclick="closeWrongDetail(event)">
    <div class="wrong-detail-box" onclick="event.stopPropagation()">
        <h3 id="wrongDetailTitle"></h3>
        <img id="wrongDetailImg" alt="题目" onclick="openLightboxSrc(this.src)">
        <div class="wd-info" id="wrongDetailInfo"></div>
        <div class="wd-actions">
            <button class="btn btn-outline" onclick="closeWrongDetail()">关闭</button>
            <button class="btn btn-primary" id="wrongRetryBtn" onclick="">重做此年</button>
        </div>
    </div>
</div>

<script>
    function openLightbox() {
        const lb = document.getElementById('lightbox');
        document.getElementById('lightboxImg').src = document.getElementById('questionImage').src;
        lb.classList.add('open');
    }
    function openLightboxSrc(src) {
        document.getElementById('lightboxImg').src = src;
        document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLightbox(); closeWrongDetail(); } });

    // Render spine rings
    document.getElementById('spineRings').innerHTML = Array(6).fill('').map(() =>
        '<div class="ring-group"><div class="hole l"></div><div class="ring"></div><div class="hole r"></div></div>'
    ).join('');

    let currentLevel = new URLSearchParams(location.search).get('level') || 'b';
    let currentYear = null, questions = [], currentIndex = 0, userAnswers = {};
    let quizStartTime = null, quizSubmitted = false, timerInterval = null;

    const isC = () => currentLevel === 'c';
    const dataBase = () => isC() ? 'level-c/data' : 'data';
    const imgBase = () => isC() ? 'level-c' : '';

    async function init() {
        document.querySelectorAll('.lv-tab').forEach(t =>
            t.classList.toggle('active', t.dataset.level === currentLevel));
        document.getElementById('pdfLink').href = isC() ? 'papers.html?level=c' : 'papers.html';
        await loadYears();
    }

    async function loadYears() {
        try {
            const r = await fetch(`${dataBase()}/index.json`);
            const d = await r.json();
            renderYearGrid(d.years);
        } catch { document.getElementById('yearGrid').innerHTML = '<div class="loading">暂无数据</div>'; }
    }

    function switchLevel(lv) {
        currentLevel = lv;
        history.replaceState(null, '', lv === 'b' ? 'quiz.html' : 'quiz.html?level=c');
        document.querySelectorAll('.lv-tab').forEach(t =>
            t.classList.toggle('active', t.dataset.level === lv));
        document.getElementById('pdfLink').href = isC() ? 'papers.html?level=c' : 'papers.html';
        hidePanel();
        loadYears();
    }

    function renderYearGrid(years) {
        document.getElementById('yearGrid').innerHTML = years.map(y => `
            <div class="year-card" onclick="startQuiz(${y.year})">
                <div class="yr">${y.year}</div>
                <div class="cnt">${y.totalQuestions} 题</div>
            </div>`).join('');
    }

    let pendingYear = null, pendingData = null;

    async function startQuiz(year) {
        try {
            const r = await fetch(`${dataBase()}/${year}.json`);
            const d = await r.json();
            pendingYear = year;
            pendingData = d;
            const lv = currentLevel.toUpperCase();
            const total = d.questions.length;
            document.getElementById('modalTitle').textContent = `${year} 年 · Level ${lv}`;
            document.getElementById('modalInfo').textContent = `共 ${total} 题 · 满分 120 分 · 开始后自动计时`;
            document.getElementById('startModal').classList.add('open');
        } catch { alert('加载失败'); }
    }

    function closeStartModal() {
        document.getElementById('startModal').classList.remove('open');
        pendingYear = null; pendingData = null;
    }

    function confirmStart() {
        document.getElementById('startModal').classList.remove('open');
        if (!pendingYear || !pendingData) return;
        currentYear = pendingYear; questions = pendingData.questions;
        currentIndex = 0; userAnswers = {};
        quizStartTime = Date.now(); quizSubmitted = false;
        startTimer();
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('quizPage').style.display = 'flex';
        document.getElementById('resultsPage').style.display = 'none';
        document.getElementById('quizTitle').textContent = `${currentYear} · Level ${currentLevel.toUpperCase()}`;
        // Issue #5: preload first few images
        preloadImages(0);
        renderQuestion();
        pendingYear = null; pendingData = null;
    }

    // Issue #5: Preload images ahead
    function preloadImages(fromIndex) {
        for (let i = fromIndex; i < Math.min(fromIndex + 3, questions.length); i++) {
            const img = new Image();
            const pre = imgBase() ? `${imgBase()}/${currentYear}` : `${currentYear}`;
            img.src = `${pre}/${questions[i].image}`;
        }
    }

    // Get option text from question data if available, else just letter
    function getOptionText(q, letter) {
        if (q.options && q.options.length === 5) {
            const idx = 'ABCDE'.indexOf(letter);
            return q.options[idx] || letter;
        }
        return letter;
    }

    function renderQuestion() {
        const q = questions[currentIndex];
        const selected = userAnswers[q.number];
        const ac = Object.keys(userAnswers).length;

        document.getElementById('correctCount').textContent = ac;
        document.getElementById('scorePercent').textContent = `${questions.length} 题`;
        document.getElementById('progressFill').style.width = ((currentIndex+1)/questions.length*100)+'%';

        document.getElementById('questionBadge').textContent = `第 ${q.number} 题`;
        document.getElementById('questionPoints').textContent = `${q.points} 分`;
        document.getElementById('qNumber').textContent = `Question ${q.number}`;
        document.getElementById('qSub').textContent = `${currentYear} · Level ${currentLevel.toUpperCase()} · ${q.points} points`;

        // Issue #5: image loading state
        const imgEl = document.getElementById('questionImage');
        imgEl.classList.add('loading');
        const pre = imgBase() ? `${imgBase()}/${currentYear}` : `${currentYear}`;
        imgEl.src = `${pre}/${q.image}`;
        imgEl.onload = () => imgEl.classList.remove('loading');
        imgEl.onerror = () => imgEl.classList.remove('loading');

        // Preload upcoming images
        preloadImages(currentIndex + 1);

        // Options
        document.getElementById('options').innerHTML = ['A','B','C','D','E'].map(o => {
            let c = 'option';
            const optText = getOptionText(q, o);
            if (quizSubmitted) {
                c += ' disabled';
                if (o === selected) c += o === q.answer ? ' correct selected' : ' wrong selected';
                else if (o === q.answer) c += ' correct';
            } else if (o === selected) {
                c += ' selected';
            }
            return `<div class="${c}" onclick="selectOption('${o}')">
                <div class="opt-check"></div>
                <div class="opt-label">(${o}) ${optText !== o ? optText : ''}</div>
            </div>`;
        }).join('');

        // Issue #6: Render action bar based on state
        renderActionBar(q, selected);

        // Feedback: only after quiz submitted
        const fb = document.getElementById('feedback');
        if (quizSubmitted && selected) {
            const ok = selected === q.answer;
            fb.className = 'feedback show ' + (ok ? 'correct' : 'wrong');
            fb.textContent = ok ? `✓ 回答正确 (+${q.points}分)` : `✗ 正确答案: ${q.answer} (${selected ? '-1分' : '0分'})`;
        } else if (quizSubmitted && !selected) {
            fb.className = 'feedback show';
            fb.style.background = '#f5f3f0'; fb.style.color = 'var(--ink-light)';
            fb.textContent = `未作答 · 正确答案: ${q.answer} (0分)`;
        } else {
            fb.className = 'feedback';
            fb.style.background = ''; fb.style.color = '';
        }

        document.getElementById('panelLeft').scrollTop = 0;
    }

    // Issue #6: Single primary action button pattern
    function renderActionBar(q, selected) {
        const isFirst = currentIndex === 0;
        const isLast = currentIndex === questions.length - 1;
        const allAnswered = Object.keys(userAnswers).length === questions.length;
        const bar = document.getElementById('actionBar');

        if (quizSubmitted) {
            // After submit: just prev/next navigation, "查看结果" on last
            const prevBtn = isFirst ? '' : `<button class="btn btn-ghost" onclick="prevQuestion()">← 上一题</button>`;
            const nextText = isLast ? '查看结果 →' : '下一题 →';
            bar.innerHTML = `${prevBtn}<button class="btn btn-primary" onclick="nextQuestion()">${nextText}</button>`;
            return;
        }

        // Before submit
        let html = '';

        // Prev button
        if (!isFirst) {
            html += `<button class="btn btn-ghost" onclick="prevQuestion()">← 上一题</button>`;
        }

        if (!selected) {
            // No answer selected: "跳过" as primary, or "提交试卷" if last & all answered
            if (isLast && allAnswered) {
                html += `<button class="btn btn-primary" onclick="submitQuiz()">提交试卷</button>`;
            } else {
                html += `<button class="btn btn-outline" onclick="skipQuestion()">跳过</button>`;
            }
        } else {
            // Answer selected: "确认" as primary action
            if (isLast) {
                if (allAnswered) {
                    html += `<button class="btn btn-outline" onclick="nextQuestion()">确认并提交试卷 →</button>`;
                } else {
                    html += `<button class="btn btn-primary" onclick="confirmAndNext()">确认</button>`;
                }
            } else {
                html += `<button class="btn btn-primary" onclick="confirmAndNext()">确认，下一题 →</button>`;
            }
        }

        bar.innerHTML = html;
    }

    function selectOption(l) {
        if (quizSubmitted) return;
        userAnswers[questions[currentIndex].number] = l;
        renderQuestion();
    }

    // Issue #6: Combined confirm + next
    function confirmAndNext() {
        const q = questions[currentIndex];
        if (!userAnswers[q.number]) return;
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            renderQuestion();
        }
    }

    // Issue #6: Skip (move to next without answering)
    function skipQuestion() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            renderQuestion();
        }
    }

    function submitAnswer() {
        const q = questions[currentIndex];
        if (!userAnswers[q.number]) return;
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            renderQuestion();
        }
    }

    function prevQuestion() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

    function nextQuestion() {
        if (quizSubmitted) {
            if (currentIndex < questions.length-1) { currentIndex++; renderQuestion(); }
            else showResultsPage();
            return;
        }
        // If last question and all answered -> submit quiz
        const allAnswered = Object.keys(userAnswers).length === questions.length;
        if (currentIndex === questions.length-1 && allAnswered) {
            submitQuiz();
        } else {
            if (currentIndex < questions.length-1) { currentIndex++; renderQuestion(); }
        }
    }

    function submitQuiz() {
        if (quizSubmitted) return;
        const unanswered = questions.filter(q => !userAnswers[q.number]);
        if (unanswered.length > 0) {
            if (!confirm(`还有 ${unanswered.length} 题未作答（未答题不加不扣分），确认提交？`)) return;
        }
        quizSubmitted = true;
        stopTimer();
        currentIndex = 0;
        renderQuestion();
        const duration = Math.round((Date.now() - quizStartTime) / 1000);
        submitQuizResult(duration);
    }

    // Issue #4: Official Kangaroo Math scoring
    // Base: 24 pts, Q1-8: 3pts, Q9-16: 4pts, Q17-24: 5pts
    // Correct: +points, Wrong: -1, Unanswered: 0, Min: 0, Max: 120
    function calcScore() {
        let baseScore = 24;
        let earnedPoints = 0;
        let penalty = 0;
        let correct = 0;
        let wrong = 0;
        let unanswered = 0;

        questions.forEach(q => {
            const ua = userAnswers[q.number];
            if (!ua) {
                unanswered++;
            } else if (ua === q.answer) {
                earnedPoints += q.points;
                correct++;
            } else {
                penalty += 1;
                wrong++;
            }
        });

        const rawScore = baseScore + earnedPoints - penalty;
        const score = Math.max(0, rawScore);
        const maxScore = 120; // 24 + 96

        return { score, maxScore, correct, wrong, unanswered, baseScore, earnedPoints, penalty };
    }

    function showResultsPage() {
        const { score, maxScore, correct, wrong, unanswered, baseScore, earnedPoints, penalty } = calcScore();
        document.getElementById('quizPage').style.display = 'none';
        document.getElementById('resultsPage').style.display = 'block';
        document.getElementById('finalScore').textContent = `${score} 分`;

        // Breakdown
        document.getElementById('finalBreakdown').innerHTML =
            `<div><span class="label">起始分：</span>${baseScore} 分</div>` +
            `<div><span class="label">答对加分：</span>+${earnedPoints} 分（${correct} 题）</div>` +
            `<div><span class="label">答错扣分：</span>-${penalty} 分（${wrong} 题）</div>` +
            `<div><span class="label">未作答：</span>${unanswered} 题（不加不扣）</div>` +
            `<div style="margin-top:6px;border-top:1px solid var(--paper-shadow);padding-top:6px;font-weight:600;">` +
            `<span class="label">最终得分：</span>${baseScore} + ${earnedPoints} - ${penalty} = ${score} 分 / ${maxScore} 分</div>`;

        const duration = Math.round((Date.now() - quizStartTime) / 1000);
        const mins = Math.floor(duration / 60), secs = duration % 60;
        document.getElementById('finalDetail').textContent = `用时 ${mins}分${secs}秒`;

        const p = score / maxScore, g = document.getElementById('finalGrade');
        if (p >= .9) { g.textContent = '优秀'; g.className = 'results-grade grade-a'; }
        else if (p >= .75) { g.textContent = '良好'; g.className = 'results-grade grade-b'; }
        else if (p >= .6) { g.textContent = '继续努力'; g.className = 'results-grade grade-c'; }
        else { g.textContent = '加油'; g.className = 'results-grade grade-d'; }
    }

    async function submitQuizResult(duration) {
        const token = localStorage.getItem('token');
        if (!token) return;
        const { score, correct } = calcScore();
        const answers = questions.map(q => ({
            question: q.number, answer: userAnswers[q.number] || '',
            correct: q.answer, isRight: userAnswers[q.number] === q.answer,
            points: q.points,
        }));
        try {
            await fetch('/api/quiz/submit', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ level: currentLevel, year: currentYear, answers, duration, score }),
            });
        } catch {}
    }

    function restartQuiz() { startQuiz(currentYear); }
    function goHome() {
        stopTimer();
        document.getElementById('homePage').style.display = 'block';
        document.getElementById('quizPage').style.display = 'none';
        document.getElementById('resultsPage').style.display = 'none';
        hidePanel();
    }

    // Timer
    function startTimer() {
        stopTimer();
        updateTimerDisplay();
        timerInterval = setInterval(updateTimerDisplay, 1000);
    }
    function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
    function updateTimerDisplay() {
        if (!quizStartTime) return;
        const s = Math.round((Date.now() - quizStartTime) / 1000);
        const m = Math.floor(s / 60), sec = s % 60;
        document.getElementById('timerDisplay').textContent =
            `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    // Issue #2: Fix history panel - unified panel management
    function hidePanel() {
        document.getElementById('historyPanel').style.display = 'none';
        document.getElementById('wrongPanel').style.display = 'none';
        document.getElementById('yearGrid').style.display = '';
        // Remove active state from nav links
        document.querySelectorAll('.nav-row .nav-link').forEach(l => l.classList.remove('active'));
    }

    // Issue #2: History - fixed
    async function showHistory() {
        hidePanel();
        document.getElementById('yearGrid').style.display = 'none';
        document.getElementById('historyPanel').style.display = 'block';
        document.getElementById('historyLink').classList.add('active');
        document.getElementById('historyList').innerHTML = '<div class="loading">加载中...</div>';

        const token = localStorage.getItem('token');
        if (!token) {
            document.getElementById('historyList').innerHTML = '<div class="history-empty">请先登录查看历史成绩</div>';
            return;
        }

        try {
            const r = await fetch(`/api/quiz/history?level=${currentLevel}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (!r.ok) throw new Error('API error');
            const d = await r.json();
            const list = d.sessions || [];

            if (!list.length) {
                document.getElementById('historyList').innerHTML = '<div class="history-empty">暂无做题记录，完成一套题目后这里会显示成绩</div>';
                return;
            }

            document.getElementById('historyList').innerHTML = list.map(s => {
                const dt = s.created_at ? s.created_at.replace('T',' ').slice(0,16) : '';
                const mins = Math.floor((s.duration||0)/60), secs = (s.duration||0)%60;
                const lvLabel = (s.level||'b').toUpperCase();
                return `<div class="history-item">
                    <div class="hi-left">
                        <div class="hi-title">Level ${lvLabel} · ${s.year} 年</div>
                        <div class="hi-meta">${dt} · 正确 ${s.correct}/${s.total} · 用时 ${mins}分${secs}秒</div>
                    </div>
                    <div class="hi-score">${s.score} 分</div>
                </div>`;
            }).join('');
        } catch {
            document.getElementById('historyList').innerHTML = '<div class="history-empty">加载失败，请稍后再试</div>';
        }
    }

    // Issue #3: Wrong questions book
    async function showWrongBook() {
        hidePanel();
        document.getElementById('yearGrid').style.display = 'none';
        document.getElementById('wrongPanel').style.display = 'block';
        document.getElementById('wrongLink').classList.add('active');
        document.getElementById('wrongList').innerHTML = '<div class="loading">加载中...</div>';

        const token = localStorage.getItem('token');
        if (!token) {
            document.getElementById('wrongList').innerHTML = '<div class="history-empty">请先登录查看错题本</div>';
            return;
        }

        try {
            const r = await fetch(`/api/quiz/wrong?level=${currentLevel}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (!r.ok) throw new Error('API error');
            const d = await r.json();
            const list = d.wrong || [];

            if (!list.length) {
                document.getElementById('wrongList').innerHTML = '<div class="history-empty">暂无错题记录，全部答对！</div>';
                return;
            }

            document.getElementById('wrongList').innerHTML = list.map((w, i) => {
                const lvLabel = (w.level||'b').toUpperCase();
                const pre = w.level === 'c' ? `level-c/${w.year}` : `${w.year}`;
                return `<div class="wrong-item" onclick='showWrongDetail(${JSON.stringify(w)})'>
                    <div class="wi-left">
                        <div class="wi-title">Level ${lvLabel} · ${w.year} 年 · 第 ${w.question} 题</div>
                        <div class="wi-meta">${w.created_at ? w.created_at.replace('T',' ').slice(0,16) : ''}</div>
                    </div>
                    <div class="wi-answers">
                        <span class="wi-wrong">${w.user_answer}</span>
                        <span>→</span>
                        <span class="wi-correct">${w.correct_answer}</span>
                    </div>
                </div>`;
            }).join('');
        } catch {
            document.getElementById('wrongList').innerHTML = '<div class="history-empty">加载失败，请稍后再试</div>';
        }
    }

    function showWrongDetail(w) {
        const lvLabel = (w.level||'b').toUpperCase();
        const pre = w.level === 'c' ? `level-c/${w.year}` : `${w.year}`;
        document.getElementById('wrongDetailTitle').textContent = `Level ${lvLabel} · ${w.year} 年 · 第 ${w.question} 题`;
        document.getElementById('wrongDetailImg').src = `${pre}/q${w.question}.png`;
        document.getElementById('wrongDetailInfo').innerHTML =
            `<div>你的答案：<span style="color:var(--error);text-decoration:line-through;">${w.user_answer}</span></div>` +
            `<div>正确答案：<span style="color:var(--success);font-weight:600;">${w.correct_answer}</span></div>`;
        document.getElementById('wrongRetryBtn').onclick = () => { closeWrongDetail(); startQuiz(w.year); };
        document.getElementById('wrongDetailOverlay').classList.add('open');
    }

    function closeWrongDetail(e) {
        if (e && e.target !== document.getElementById('wrongDetailOverlay')) return;
        document.getElementById('wrongDetailOverlay').classList.remove('open');
    }

    // Legacy compat
    function hideHistory() { hidePanel(); }

    init();
</script>
</body>
</html>
