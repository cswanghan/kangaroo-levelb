<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>袋鼠数学 · 在线练习</title>
    <script src="auth-guard.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cream: #faf8f5;
            --warm: #f3ede6;
            --rose: #c4a08a;
            --rose-light: #e8d5c8;
            --rose-bg: #fdf5f0;
            --text: #3d3530;
            --text-light: #8a7e76;
            --accent: #b07d62;
            --success: #6b9a7d;
            --success-bg: #edf5f0;
            --error: #c47070;
            --error-bg: #fdf0f0;
        }

        body {
            font-family: 'Noto Serif SC', 'Georgia', serif;
            background: var(--cream);
            min-height: 100vh;
            color: var(--text);
        }

        /* ===== Year Select ===== */
        .select-page { max-width: 800px; margin: 0 auto; padding: 48px 24px; }

        .select-header { text-align: center; margin-bottom: 36px; }
        .select-header h1 {
            font-family: 'Playfair Display', 'Noto Serif SC', serif;
            font-size: 2rem; font-weight: 700; margin-bottom: 6px;
        }
        .select-header .sub { color: var(--text-light); font-size: 0.9rem; }

        .nav-row { display: flex; justify-content: center; gap: 14px; margin-bottom: 32px; }
        .nav-link {
            color: var(--text-light); text-decoration: none; font-size: 0.85rem;
            padding: 6px 18px; border: 1px solid var(--warm); border-radius: 16px; transition: all 0.2s;
        }
        .nav-link:hover { color: var(--accent); border-color: var(--rose); }

        .level-switch { display: flex; justify-content: center; border-bottom: 1px solid var(--rose-light); margin-bottom: 32px; }
        .lv-tab {
            padding: 10px 28px; font-size: 0.9rem; color: var(--text-light);
            cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .lv-tab:hover { color: var(--text); }
        .lv-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

        .year-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; }
        .year-card {
            background: white; border: 1px solid var(--warm); padding: 24px 12px;
            border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.2s;
        }
        .year-card:hover { border-color: var(--rose); box-shadow: 0 4px 16px rgba(180,140,110,0.1); transform: translateY(-2px); }
        .year-card .yr { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 600; color: var(--accent); }
        .year-card .cnt { color: var(--text-light); font-size: 0.8rem; margin-top: 4px; }

        /* ===== Quiz Layout ===== */
        .quiz-wrapper { display: none; height: 100vh; flex-direction: column; }

        .top-bar {
            background: white; padding: 10px 24px; display: flex;
            justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--warm); flex-shrink: 0;
        }
        .top-bar-left { display: flex; align-items: center; gap: 14px; }
        .back-btn {
            background: none; border: none; font-size: 1.1rem; cursor: pointer;
            color: var(--accent); padding: 4px 8px; font-family: inherit;
        }
        .quiz-title { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 1rem; }
        .top-bar-right { display: flex; gap: 20px; font-size: 0.8rem; color: var(--text-light); }
        .top-bar-right .val { font-weight: 600; color: var(--accent); font-size: 1rem; }

        .progress-bar { height: 3px; background: var(--warm); flex-shrink: 0; }
        .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }

        .quiz-body { flex: 1; display: flex; overflow: hidden; }

        .panel-left {
            flex: 1; overflow-y: auto; padding: 24px;
            background: var(--cream); border-right: 1px solid var(--warm);
        }
        .q-badge {
            display: inline-block; background: var(--rose-bg); color: var(--accent);
            padding: 4px 14px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; margin-bottom: 14px;
        }
        .q-points { display: inline-block; color: var(--text-light); font-size: 0.8rem; margin-left: 8px; }
        .question-image { width: 100%; border-radius: 8px; border: 1px solid var(--warm); background: white; }

        .panel-right { width: 300px; display: flex; flex-direction: column; background: white; flex-shrink: 0; }
        .answer-area { flex: 1; overflow-y: auto; padding: 24px; }
        .answer-label {
            font-size: 0.75rem; color: var(--text-light); text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 16px;
        }

        .options { display: grid; gap: 10px; }
        .option {
            padding: 14px 16px; border: 1px solid var(--warm); border-radius: 10px;
            cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 12px; user-select: none;
        }
        .option:hover:not(.disabled) { border-color: var(--rose); background: var(--rose-bg); }
        .option.selected { border-color: var(--accent); background: var(--rose-bg); }
        .option.correct { border-color: var(--success); background: var(--success-bg); }
        .option.wrong { border-color: var(--error); background: var(--error-bg); }
        .option.disabled { cursor: default; opacity: 0.65; }

        .opt-letter {
            width: 32px; height: 32px; border-radius: 50%; background: var(--warm);
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 0.9rem; flex-shrink: 0;
            font-family: 'Playfair Display', serif;
        }
        .option.selected .opt-letter { background: var(--accent); color: white; }
        .option.correct .opt-letter { background: var(--success); color: white; }
        .option.wrong .opt-letter { background: var(--error); color: white; }

        .feedback { margin-top: 16px; padding: 10px 14px; border-radius: 8px; display: none; font-size: 0.9rem; }
        .feedback.show { display: block; }
        .feedback.correct { background: var(--success-bg); color: #3d6b4f; }
        .feedback.wrong { background: var(--error-bg); color: #8b4444; }

        .action-bar { padding: 14px 20px; border-top: 1px solid var(--warm); display: flex; gap: 10px; flex-shrink: 0; }
        .btn {
            flex: 1; padding: 11px 14px; border: none; border-radius: 20px;
            font-size: 0.9rem; cursor: pointer; font-weight: 500; transition: all 0.15s; font-family: inherit;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #9a6b52; }
        .btn-outline { background: transparent; border: 1px solid var(--rose); color: var(--accent); }
        .btn-outline:hover { background: var(--rose-bg); }

        /* ===== Results ===== */
        .results-page { display: none; max-width: 480px; margin: 80px auto; padding: 20px; }
        .results-card {
            background: white; border: 1px solid var(--warm); border-radius: 20px;
            padding: 48px 36px; text-align: center;
        }
        .results-card h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 8px; }
        .results-score {
            font-family: 'Playfair Display', serif; font-size: 3.2rem; font-weight: 700;
            color: var(--accent); margin: 16px 0;
        }
        .results-detail { color: var(--text-light); margin-bottom: 24px; font-size: 0.9rem; }
        .results-grade { padding: 10px 24px; border-radius: 10px; display: inline-block; margin-bottom: 28px; font-size: 1.1rem; }
        .grade-a { background: var(--success-bg); color: #3d6b4f; }
        .grade-b { background: #eef2fa; color: #4a5e8a; }
        .grade-c { background: var(--rose-bg); color: #8a6a3d; }
        .grade-d { background: var(--error-bg); color: #8b4444; }
        .results-actions { display: flex; gap: 12px; justify-content: center; }

        .loading { text-align: center; padding: 40px; color: var(--text-light); }

        @media (max-width: 860px) {
            .quiz-body { flex-direction: column; }
            .panel-left { border-right: none; border-bottom: 1px solid var(--warm); max-height: 50vh; flex: none; }
            .panel-right { width: 100%; flex: 1; }
        }
        @media (max-width: 600px) {
            .select-header h1 { font-size: 1.6rem; }
            .year-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .select-page { padding: 32px 16px; }
        }
    </style>
</head>
<body>

<!-- ===== Year Select ===== -->
<div class="select-page" id="homePage">
    <div class="select-header">
        <h1>在线练习</h1>
        <p class="sub" id="headerSub">选择年份开始做题</p>
    </div>
    <div class="nav-row">
        <a href="index.html" class="nav-link">← 首页</a>
        <a href="papers.html" class="nav-link" id="pdfLink">PDF 真题</a>
    </div>
    <div class="level-switch">
        <div class="lv-tab" data-level="b" onclick="switchLevel('b')">Level B · 3-4年级</div>
        <div class="lv-tab" data-level="c" onclick="switchLevel('c')">Level C · 5-6年级</div>
    </div>
    <div class="year-grid" id="yearGrid"><div class="loading">加载中...</div></div>
</div>

<!-- ===== Quiz ===== -->
<div class="quiz-wrapper" id="quizPage">
    <div class="top-bar">
        <div class="top-bar-left">
            <button class="back-btn" onclick="goHome()">←</button>
            <span class="quiz-title" id="quizTitle">2024</span>
        </div>
        <div class="top-bar-right">
            <span>第 <span class="val" id="currentQ">1</span> 题</span>
            <span>正确 <span class="val" id="correctCount">0</span></span>
            <span><span class="val" id="scorePercent">—</span></span>
        </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="quiz-body">
        <div class="panel-left" id="panelLeft">
            <div>
                <span class="q-badge" id="questionBadge">第 1 题</span>
                <span class="q-points" id="questionPoints">3 分</span>
            </div>
            <img class="question-image" id="questionImage" alt="题目">
        </div>
        <div class="panel-right">
            <div class="answer-area">
                <div class="answer-label">选择答案</div>
                <div class="options" id="options"></div>
                <div class="feedback" id="feedback"></div>
            </div>
            <div class="action-bar">
                <button class="btn btn-outline" id="prevBtn" onclick="prevQuestion()">← 上一题</button>
                <button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">提交</button>
                <button class="btn btn-outline" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== Results ===== -->
<div class="results-page" id="resultsPage">
    <div class="results-card">
        <h2>完成</h2>
        <div class="results-score" id="finalScore">0/24</div>
        <div class="results-detail" id="finalDetail"></div>
        <div class="results-grade" id="finalGrade"></div>
        <div class="results-actions">
            <button class="btn btn-primary" onclick="restartQuiz()">重新做题</button>
            <button class="btn btn-outline" onclick="goHome()">返回</button>
        </div>
    </div>
</div>

<script>
    let currentLevel = new URLSearchParams(location.search).get('level') || 'b';
    let currentYear = null, questions = [], currentIndex = 0, userAnswers = {}, correctCount = 0;
    let quizStartTime = null;

    const isC = () => currentLevel === 'c';
    const dataBase = () => isC() ? 'level-c/data' : 'data';
    const imgBase = () => isC() ? 'level-c' : '';

    async function init() {
        document.querySelectorAll('.lv-tab').forEach(t =>
            t.classList.toggle('active', t.dataset.level === currentLevel));
        document.getElementById('pdfLink').href = isC() ? 'papers.html?level=c' : 'papers.html';
        await loadYears();
    }

    async function loadYears() {
        try {
            const r = await fetch(`${dataBase()}/index.json`);
            const d = await r.json();
            renderYearGrid(d.years);
        } catch { document.getElementById('yearGrid').innerHTML = '<div class="loading">暂无数据</div>'; }
    }

    function switchLevel(lv) {
        currentLevel = lv;
        history.replaceState(null, '', lv === 'b' ? 'quiz.html' : 'quiz.html?level=c');
        document.querySelectorAll('.lv-tab').forEach(t =>
            t.classList.toggle('active', t.dataset.level === lv));
        document.getElementById('pdfLink').href = isC() ? 'papers.html?level=c' : 'papers.html';
        loadYears();
    }

    function renderYearGrid(years) {
        document.getElementById('yearGrid').innerHTML = years.map(y => `
            <div class="year-card" onclick="startQuiz(${y.year})">
                <div class="yr">${y.year}</div>
                <div class="cnt">${y.totalQuestions} 题</div>
            </div>`).join('');
    }

    async function startQuiz(year) {
        try {
            const r = await fetch(`${dataBase()}/${year}.json`);
            const d = await r.json();
            currentYear = year; questions = d.questions;
            currentIndex = 0; userAnswers = {}; correctCount = 0;
            quizStartTime = Date.now();
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('quizPage').style.display = 'flex';
            document.getElementById('resultsPage').style.display = 'none';
            document.getElementById('quizTitle').textContent = `${year} · Level ${currentLevel.toUpperCase()}`;
            renderQuestion();
        } catch { alert('加载失败'); }
    }

    function renderQuestion() {
        const q = questions[currentIndex], answered = userAnswers[q.number] !== undefined;
        document.getElementById('currentQ').textContent = q.number;
        document.getElementById('correctCount').textContent = correctCount;
        const ac = Object.keys(userAnswers).length;
        document.getElementById('scorePercent').textContent = ac > 0 ? Math.round(correctCount/ac*100)+'%' : '—';
        document.getElementById('progressFill').style.width = ((currentIndex+1)/questions.length*100)+'%';
        document.getElementById('questionBadge').textContent = `第 ${q.number} 题`;
        document.getElementById('questionPoints').textContent = `${q.points} 分`;
        const pre = imgBase() ? `${imgBase()}/${currentYear}` : `${currentYear}`;
        document.getElementById('questionImage').src = `${pre}/${q.image}`;

        document.getElementById('options').innerHTML = ['A','B','C','D','E'].map(o => {
            let c = 'option', d = answered ? 'disabled' : '';
            if (answered) {
                if (o === userAnswers[q.number]) c += o === q.answer ? ' correct' : ' wrong';
                if (o === q.answer) c += ' correct';
            }
            return `<div class="${c} ${d}" onclick="selectOption('${o}')"><div class="opt-letter">${o}</div></div>`;
        }).join('');

        document.getElementById('prevBtn').style.visibility = currentIndex > 0 ? 'visible' : 'hidden';
        document.getElementById('submitBtn').style.display = answered ? 'none' : 'inline-block';
        document.getElementById('nextBtn').textContent = currentIndex === questions.length-1 ? '完成 →' : '下一题 →';

        const fb = document.getElementById('feedback');
        if (answered) {
            const ok = userAnswers[q.number] === q.answer;
            fb.className = 'feedback show ' + (ok ? 'correct' : 'wrong');
            fb.textContent = ok ? '✓ 回答正确' : `✗ 正确答案: ${q.answer}`;
        } else fb.className = 'feedback';

        document.getElementById('panelLeft').scrollTop = 0;
    }

    function selectOption(l) {
        if (userAnswers[questions[currentIndex].number] !== undefined) return;
        document.querySelectorAll('.option').forEach(o =>
            o.classList.toggle('selected', o.querySelector('.opt-letter').textContent === l));
    }

    function submitAnswer() {
        const s = document.querySelector('.option.selected');
        if (!s) return;
        const l = s.querySelector('.opt-letter').textContent, q = questions[currentIndex];
        userAnswers[q.number] = l;
        if (l === q.answer) correctCount++;
        renderQuestion();
    }

    function prevQuestion() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }
    function nextQuestion() {
        if (currentIndex < questions.length-1) { currentIndex++; renderQuestion(); }
        else showResults();
    }

    function showResults() {
        document.getElementById('quizPage').style.display = 'none';
        document.getElementById('resultsPage').style.display = 'block';
        document.getElementById('finalScore').textContent = `${correctCount}/${questions.length}`;
        const duration = Math.round((Date.now() - quizStartTime) / 1000);
        const mins = Math.floor(duration / 60), secs = duration % 60;
        document.getElementById('finalDetail').textContent =
            `正确 ${correctCount} 题，正确率 ${Math.round(correctCount/questions.length*100)}%，用时 ${mins}分${secs}秒`;
        const p = correctCount/questions.length, g = document.getElementById('finalGrade');
        if (p >= .9) { g.textContent = '优秀'; g.className = 'results-grade grade-a'; }
        else if (p >= .75) { g.textContent = '良好'; g.className = 'results-grade grade-b'; }
        else if (p >= .6) { g.textContent = '继续努力'; g.className = 'results-grade grade-c'; }
        else { g.textContent = '加油'; g.className = 'results-grade grade-d'; }

        // Submit to server
        submitQuizResult(duration);
    }

    async function submitQuizResult(duration) {
        const token = localStorage.getItem('token');
        if (!token) return;

        const answers = questions.map(q => ({
            question: q.number,
            answer: userAnswers[q.number] || '',
            correct: q.answer,
            isRight: userAnswers[q.number] === q.answer,
        }));

        try {
            await fetch('/api/quiz/submit', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ level: currentLevel, year: currentYear, answers, duration }),
            });
        } catch {}
    }

    function restartQuiz() { startQuiz(currentYear); }
    function goHome() {
        document.getElementById('homePage').style.display = 'block';
        document.getElementById('quizPage').style.display = 'none';
        document.getElementById('resultsPage').style.display = 'none';
    }

    init();
</script>
</body>
</html>
