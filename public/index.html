<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>袋鼠数学 Level B - 3-4年级</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .landing {
            text-align: center;
            max-width: 720px;
            width: 100%;
        }

        .logo { font-size: 4rem; margin-bottom: 12px; }

        h1 {
            color: white;
            font-size: 2.4rem;
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .subtitle {
            color: rgba(255,255,255,0.85);
            font-size: 1.1rem;
            margin-bottom: 50px;
        }

        .entry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .entry-card {
            background: white;
            border-radius: 24px;
            padding: 48px 32px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            transition: transform 0.25s, box-shadow 0.25s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .entry-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 50px rgba(0,0,0,0.22);
        }

        .entry-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .icon-pdf { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
        .icon-quiz { background: linear-gradient(135deg, #667eea, #764ba2); }

        .entry-title {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .entry-desc {
            color: #888;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .entry-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-pdf { background: #fff0f0; color: #ee5a24; }
        .badge-quiz { background: #f0f0ff; color: #667eea; }

        footer {
            color: rgba(255,255,255,0.6);
            margin-top: 40px;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .entry-grid { grid-template-columns: 1fr; gap: 16px; }
            .entry-card { padding: 36px 24px; }
            .logo { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div class="landing">
        <div class="logo">🦘</div>
        <h1>袋鼠数学 Level B</h1>
        <p class="subtitle">国际袋鼠数学竞赛 · 3-4年级 · 2013-2025</p>

        <div class="entry-grid">
            <a href="papers.html" class="entry-card">
                <div class="entry-icon icon-pdf">📄</div>
                <div class="entry-title">历年真题 PDF</div>
                <div class="entry-desc">2013-2025 共 13 年<br>含题目与解析</div>
                <span class="entry-badge badge-pdf">查看 / 下载</span>
            </a>

            <a href="quiz.html" class="entry-card">
                <div class="entry-icon icon-quiz">🎯</div>
                <div class="entry-title">在线练习</div>
                <div class="entry-desc">逐题做、即时判对错<br>13 年真题全覆盖</div>
                <span class="entry-badge badge-quiz">开始做题</span>
            </a>
        </div>

        <footer>适合 3-4 年级学生备赛练习</footer>
    </div>
</body>
</html>
