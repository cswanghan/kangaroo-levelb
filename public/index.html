<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>袋鼠数学 · Kangaroo Math</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cream: #faf8f5;
            --warm: #f3ede6;
            --rose: #c4a08a;
            --rose-light: #e8d5c8;
            --rose-bg: #fdf5f0;
            --text: #3d3530;
            --text-light: #8a7e76;
            --accent: #b07d62;
        }

        body {
            font-family: 'Noto Serif SC', 'Georgia', serif;
            background: var(--cream);
            min-height: 100vh;
            color: var(--text);
        }

        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        /* Header */
        .site-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .site-header .icon { font-size: 3.2rem; margin-bottom: 12px; }

        .site-header h1 {
            font-family: 'Playfair Display', 'Noto Serif SC', serif;
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .site-header .tagline {
            color: var(--text-light);
            font-size: 1rem;
            letter-spacing: 1px;
        }

        /* Level selector */
        .level-tabs {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 48px;
            border-bottom: 1px solid var(--rose-light);
        }

        .level-tab {
            padding: 12px 32px;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.95rem;
            color: var(--text-light);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .level-tab:hover { color: var(--text); }

        .level-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }

        /* Level info */
        .level-info {
            text-align: center;
            margin-bottom: 48px;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .level-info .grade {
            display: inline-block;
            background: var(--rose-bg);
            color: var(--accent);
            padding: 4px 16px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-top: 6px;
        }

        /* Entry cards */
        .entry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            max-width: 640px;
            margin: 0 auto;
        }

        .entry-card {
            background: white;
            border: 1px solid var(--warm);
            border-radius: 16px;
            padding: 44px 28px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }

        .entry-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--rose-light);
            transition: background 0.25s;
        }

        .entry-card:hover {
            border-color: var(--rose);
            box-shadow: 0 8px 30px rgba(180,140,110,0.1);
            transform: translateY(-2px);
        }

        .entry-card:hover::before { background: var(--accent); }

        .entry-icon { font-size: 2.2rem; }

        .entry-title {
            font-family: 'Playfair Display', 'Noto Serif SC', serif;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .entry-desc {
            color: var(--text-light);
            font-size: 0.85rem;
            line-height: 1.7;
            text-align: center;
        }

        .entry-action {
            font-size: 0.8rem;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Login link */
        .login-link {
            text-align: center;
            margin-top: 48px;
        }

        .login-link a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 8px 20px;
            border: 1px solid var(--warm);
            border-radius: 20px;
            transition: all 0.2s;
        }

        .login-link a:hover {
            color: var(--accent);
            border-color: var(--rose);
        }

        /* Footer */
        .site-footer {
            text-align: center;
            margin-top: 60px;
            color: var(--text-light);
            font-size: 0.8rem;
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            .site-header h1 { font-size: 2rem; }
            .entry-grid { grid-template-columns: 1fr; max-width: 360px; }
            .entry-card { padding: 36px 24px; }
            .page { padding: 40px 16px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="site-header">
            <div class="icon">🦘</div>
            <h1>Kangaroo Math</h1>
            <p class="tagline">国际袋鼠数学竞赛 · 历年真题与练习</p>
        </div>

        <div class="level-tabs">
            <div class="level-tab active" onclick="switchLevel('b')">Level B</div>
            <div class="level-tab" onclick="switchLevel('c')">Level C</div>
        </div>

        <div class="level-info" id="levelInfo">
            <div>等级 B · 2013 — 2025 · 共 13 年真题</div>
            <div class="grade">适合 3-4 年级</div>
        </div>

        <div class="entry-grid">
            <a id="pdfEntry" href="papers.html" class="entry-card">
                <div class="entry-icon">📄</div>
                <div class="entry-title">历年真题</div>
                <div class="entry-desc">PDF 原卷查看与下载<br>含题目与详细解析</div>
                <div class="entry-action">Browse →</div>
            </a>

            <a id="quizEntry" href="quiz.html" class="entry-card">
                <div class="entry-icon">✏️</div>
                <div class="entry-title">在线练习</div>
                <div class="entry-desc">逐题作答 · 即时判分<br>按年份选择套卷</div>
                <div class="entry-action">Start →</div>
            </a>
        </div>

        <div class="login-link">
            <a href="login.html">登录 / 注册</a>
        </div>

        <div class="site-footer">
            Math Kangaroo Practice System
        </div>
    </div>

    <script>
        let currentLevel = 'b';

        const levelConfig = {
            b: {
                label: '等级 B · 2013 — 2025 · 共 13 年真题',
                grade: '适合 3-4 年级',
                pdf: 'papers.html',
                quiz: 'quiz.html'
            },
            c: {
                label: '等级 C · 2013 — 2025 · 共 13 年真题',
                grade: '适合 5-6 年级',
                pdf: 'papers.html?level=c',
                quiz: 'quiz.html?level=c'
            }
        };

        function switchLevel(level) {
            currentLevel = level;
            const cfg = levelConfig[level];

            document.querySelectorAll('.level-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.level-tab:nth-child(${level === 'b' ? 1 : 2})`).classList.add('active');

            document.getElementById('levelInfo').innerHTML =
                `<div>${cfg.label}</div><div class="grade">${cfg.grade}</div>`;
            document.getElementById('pdfEntry').href = cfg.pdf;
            document.getElementById('quizEntry').href = cfg.quiz;
        }
    </script>
</body>
</html>
